name: Windows Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-windows:
    name: Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-build.txt
      - name: Build portable Windows package
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: econ-paper-analyzer-windows-x64
          path: dist/releases/v*/econ-paper-analyzer-windows-x64-v*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: econ-paper-analyzer-windows-x64-checksum
          path: dist/releases/v*/econ-paper-analyzer-windows-x64-v*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Attach packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = $env:GITHUB_REF_NAME
          $Package = Get-ChildItem -Path dist/releases -Filter "econ-paper-analyzer-windows-x64-v*.zip" -Recurse | Select-Object -First 1
          $Checksum = Get-ChildItem -Path dist/releases -Filter "econ-paper-analyzer-windows-x64-v*.sha256" -Recurse | Select-Object -First 1
          if ($null -eq $Package -or $null -eq $Checksum) {
            throw "Windows release assets were not created."
          }
          gh release view $Tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $Tag --repo $env:GITHUB_REPOSITORY --title "Econ Paper Analyzer $Tag" --generate-notes
          }
          gh release upload $Tag $Package.FullName $Checksum.FullName --repo $env:GITHUB_REPOSITORY --clobber
