name: Windows Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-windows:
    name: Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-build.txt
      - name: Build portable Windows package
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: econ-paper-analyzer-windows-x64
          path: dist/releases/v*/econ-paper-analyzer-windows-x64-v*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: econ-paper-analyzer-windows-x64-checksum
          path: dist/releases/v*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
