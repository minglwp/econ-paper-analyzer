[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "econ-paper-analyzer"
version = "0.3.7"
description = "Local, reproducible analysis workflow for management and economics survey papers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pywebview>=6.2,<7",
  "jinja2>=3.1,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "scikit-learn>=1.5,<2",
  "semopy>=2.3.11,<3",
  "matplotlib>=3.9,<4",
  "openpyxl>=3.1,<4",
  "xlsxwriter>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*", "examples*"]

[tool.setuptools.package-data]
app = ["static/*", "templates/*"]
examples = ["*.csv", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
